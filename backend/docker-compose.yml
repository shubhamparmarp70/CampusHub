services:
  mysql:
    image: mysql:8.4
    command: --default-time-zone=+00:00 --character-set-server=utf8mb4
    environment:
      MYSQL_DATABASE: campushub
      MYSQL_USER: campus
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-change-me}
    ports: ["3306:3306"]
    volumes: [dbdata:/var/lib/mysql]
volumes:
  dbdata:
