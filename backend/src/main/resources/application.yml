spring:
  application.name: campus-hub
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
  flyway.enabled: true
  servlet.multipart: { max-file-size: 10MB, max-request-size: 11MB }
  jackson.serialization.write-dates-as-timestamps: false
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties.mail.smtp: { auth: true, starttls.enable: true }
app:
  base-url: ${APP_BASE_URL:http://localhost:5173}
  mail-from: ${MAIL_FROM:no-reply@campushub.local}
  require-email-verification: false
  jwt:
    secret: ${JWT_SECRET}
    access-ttl-minutes: 15
    refresh-ttl-days: 30
  cors.allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  money.advance-percent: 50
  otp: { secret: "${OTP_SECRET}", ttl-minutes: 15 }
  payments:
    gateway: sandbox            # replace with a real PhonePe / Google Pay adapter before production
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET}
  storage:
    bucket: ${S3_BUCKET:}
    endpoint: ${S3_ENDPOINT:}   # leave empty for AWS; set for Cloudflare R2 / MinIO
    region: ${S3_REGION:auto}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    retention-days: 7
    signed-url-minutes: 5
  admin: { email: "${ADMIN_EMAIL:}", password: "${ADMIN_PASSWORD:}" }
  sms:
    provider: console            # console = development (the code is printed in the backend console) | twilio
    twilio:
      account-sid: "${TWILIO_ACCOUNT_SID:}"
      auth-token: "${TWILIO_AUTH_TOKEN:}"
      from: "${TWILIO_FROM:}"
      messaging-service-sid: "${TWILIO_MESSAGING_SERVICE_SID:}"
  rate-limit.enabled: true
server:
  error.include-stacktrace: never
  forward-headers-strategy: native
springdoc.swagger-ui.path: /swagger-ui.html
